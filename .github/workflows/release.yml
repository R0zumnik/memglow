# Release pipeline, triggered by pushing a version tag (vX.Y.Z) that matches package.json:
#   1. tests
#   2. npm publish via Trusted Publishing (OIDC, no token stored; skipped if the version already exists)
#   3. Docker image on ghcr.io/r0zumnik/memglow (amd64 + arm64; tags :X.Y.Z, :X.Y, :latest)
#   4. GitHub release, with the matching CHANGELOG.md section as notes
# To release: bump "version" in package.json, add a "## X.Y.Z — date" CHANGELOG entry, commit,
# then `git tag vX.Y.Z && git push origin main vX.Y.Z`.
# Actions are on their Node 24 majors (runner ≥ 2.327.1). Nothing here depends on the Ubuntu
# release behind ubuntu-latest: Node comes from setup-node, Docker from buildx/QEMU, and only
# preinstalled tools are used (npm, awk, gh).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

# A tag push sometimes fires twice: never run two releases of the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json $v"; exit 1; }
      - run: npm test

  npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - name: Publish (skipped if this version is already on npm)
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "memglow@$v" version >/dev/null 2>&1; then
            echo "memglow@$v already on npm, skipping"
          else
            npm publish --access public --provenance
          fi

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/r0zumnik/memglow
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.ref_name == github.event.repository.default_branch }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [npm, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the release from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $GITHUB_REF_NAME" > notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
