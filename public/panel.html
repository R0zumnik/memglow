<!doctype html>
<html lang="en" data-title="{{title}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{title}} · Control panel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230D2026'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%233BE8A0'/%3E%3C/svg%3E">
<link rel="preload" href="/vendor/fonts/bricolage-grotesque-latin.woff2?v={{v:vendor/fonts/bricolage-grotesque-latin.woff2}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/panel.css?v={{v:panel.css}}">
<script src="/panel-boot.js?v={{v:panel-boot.js}}"></script>
</head>
<body>
<a class="skip" href="#main" data-i18n="panel.skip">Skip to content</a>
<header class="top">
  <div class="top__in">
    <a class="brand" href="/" data-i18n-attr="title:panel.backToGraph" title="Memory graph"><span class="brand__dot" aria-hidden="true"></span>{{title}}</a>
    <div class="server" id="ns-server"><span class="pulse pulse--off" aria-hidden="true"></span><span data-i18n="common.loading">Loading…</span></div>
    <div class="top__tools">
      <a class="toolink" href="/"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="6" r="2"/><circle cx="14" cy="18" r="3"/><path d="M8.2 8.3l4.2 7M16.9 7.7l-1.8 7.5"/></svg><span data-i18n="panel.backToGraph">Memory graph</span></a>
      <label class="sr" for="ns-lang" data-i18n="panel.language">Language</label>
      <select class="select" id="ns-lang">
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="es">Español</option>
        <option value="pt-BR">Português (Brasil)</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="zh-CN">中文（简体）</option>
      </select>
      <label class="sr" for="ns-theme" data-i18n="panel.theme">Theme</label>
      <select class="select" id="ns-theme">
        <option value="" data-i18n="panel.themeSystem">System theme</option>
        <option value="light" data-i18n="panel.themeLight">Light</option>
        <option value="dark" data-i18n="panel.themeDark">Dark</option>
      </select>
    </div>
  </div>
  <nav class="nav" data-i18n-attr="aria-label:panel.navAria" aria-label="Sections">
    <a href="#overview" aria-current="true" data-i18n="panel.navOverview">Overview</a>
    <a href="#maintenance"><span data-i18n="panel.navMaintenance">Maintenance</span> <span class="badge" id="ns-badge" hidden></span></a>
    <a href="#savings" data-i18n="panel.navSavings">Savings</a>
    <a href="#provider" data-i18n="panel.navProvider">AI provider</a>
    <a href="#settings" data-i18n="panel.navSettings">Settings</a>
  </nav>
</header>
<main class="wrap" id="main">
  <div class="alert alert--page" id="ns-error" role="alert" hidden>
    <p id="ns-error-msg"></p>
    <button type="button" class="btn alert__act" id="ns-error-btn"></button>
  </div>
  <div id="ns-body"><div class="skeleton" aria-hidden="true"></div><p class="sr" data-i18n="common.loading">Loading…</p></div>
</main>
<div class="tip" id="ns-tip" hidden></div>
<script src="/i18n.js?v={{v:i18n.js}}"></script>
<script src="/control.js?v={{v:control.js}}"></script>
</body>
</html>
